name: Update profile cards

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate SVG cards
        run: node scripts/generate.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: add a PAT secret named GH_PAT to include private contributions
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: update profile cards"
          git push
