<text x="224" y="196" font-size="12" fill="#ff2d55">IEEE PUA Student Branch</text>
<text x="224" y="216" font-size="12" fill="#7f8a99">Led publicity, media and campaigns; authored the branch brand identity guidelines.</text>
<text x="224" y="233" font-size="12" fill="#7f8a99">Ran recruitment and team operations for the Robotics Committee (RUV competition).</text></g><g class="fu" style="animation-delay:1.20s"><text x="36" y="272" font-size="10.5" letter-spacing=".5" fill="#39ff14">NOV 2025 — PRESENT</text>
<circle cx="200" cy="268" r="6" fill="#06090d" stroke="#39ff14" stroke-width="2" filter="url(#glowG)"/><circle cx="200" cy="268" r="2.5" fill="#39ff14" class="pulse"/>
<text x="224" y="272" font-size="15" font-weight="700" fill="#eaf6ee">Brand Ambassador</text>
<text x="224" y="292" font-size="12" fill="#39ff14">Sprints · Hybrid</text>
<text x="224" y="312" font-size="12" fill="#7f8a99">Promoted educational and technology programs through community</text>
<text x="224" y="329" font-size="12" fill="#7f8a99">outreach and digital engagement.</text></g><g class="fu" style="animation-delay:1.60s"><text x="36" y="368" font-size="10.5" letter-spacing=".5" fill="#ff2d55">GAIC CERTIFIED</text>
<circle cx="200" cy="364" r="6" fill="#06090d" stroke="#ff2d55" stroke-width="2" filter="url(#glowR)"/><circle cx="200" cy="364" r="2.5" fill="#ff2d55" class="pulse"/>
<text x="224" y="368" font-size="15" font-weight="700" fill="#eaf6ee">Generative AI Trainee</text>
<text x="224" y="388" font-size="12" fill="#ff2d55">Sprints &amp; IOM Egypt</text>
<text x="224" y="408" font-size="12" fill="#7f8a99">Completed the Generative AI Certification: prompt engineering,</text>
