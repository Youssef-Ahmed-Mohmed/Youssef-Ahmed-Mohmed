<text x="224" y="100" font-size="12" fill="#39ff14">The Connector Consultancy (D&amp;Partners) · Alexandria</text>
<text x="224" y="120" font-size="12" fill="#7f8a99">Built full-stack features with React, Next.js, Node.js, Express and SQL,</text>
<text x="224" y="137" font-size="12" fill="#7f8a99">following Git-based team workflows. Practiced Docker &amp; deployment.</text></g><g class="fu" style="animation-delay:0.80s"><text x="36" y="176" font-size="10.5" letter-spacing=".5" fill="#ff2d55">MAR 2025 — SEP 2026</text>
<circle cx="200" cy="172" r="6" fill="#06090d" stroke="#ff2d55" stroke-width="2" filter="url(#glowR)"/><circle cx="200" cy="172" r="2.5" fill="#ff2d55" class="pulse"/>
