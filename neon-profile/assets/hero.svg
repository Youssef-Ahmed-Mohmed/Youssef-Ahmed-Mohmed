<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace">
<style>
.fu{animation:fu .8s ease-out both}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi 1s ease-out both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.run{stroke-dasharray:130 870;animation:run 5s linear infinite}
@keyframes run{to{stroke-dashoffset:-1000}}
.scan{animation:scan 6s linear infinite}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(1000px)}}
.scan2{animation:scan2 5s ease-in-out infinite alternate}
@keyframes scan2{from{transform:translateX(0)}to{transform:translateX(800px)}}
.grow{animation:grow 1.4s ease-out both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.draw{transform-box:fill-box;transform-origin:top;animation:draw 1.6s ease-out both}
@keyframes draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.rA{animation:roleA 9s linear infinite}
@keyframes roleA{0%,28%{opacity:1}33%,95%{opacity:0}100%{opacity:1}}
.rB{opacity:0;animation:role 9s linear 3s infinite}
.rC{opacity:0;animation:role 9s linear 6s infinite}
@keyframes role{0%{opacity:0}5%,28%{opacity:1}33%,100%{opacity:0}}
</style>
<defs>
<filter id="glowG" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowR" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#39ff14"/><stop offset="1" stop-color="#ff2d55"/></linearGradient>
<radialGradient id="bgG" cx="1" cy="1" r="0.8"><stop offset="0" stop-color="#39ff14" stop-opacity=".13"/><stop offset="1" stop-color="#39ff14" stop-opacity="0"/></radialGradient>
<radialGradient id="bgR" cx="0" cy="0" r="0.7"><stop offset="0" stop-color="#ff2d55" stop-opacity=".12"/><stop offset="1" stop-color="#ff2d55" stop-opacity="0"/></radialGradient>
<linearGradient id="scanG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39ff14" stop-opacity="0"/><stop offset="1" stop-color="#39ff14" stop-opacity=".22"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
</defs>
<rect x="0" y="0" width="900" height="270" rx="18" fill="#0b0f15" stroke="#1b2330"/><rect x="0" y="0" width="900" height="270" rx="18" fill="url(#bgG)"/><rect x="0" y="0" width="900" height="270" rx="18" fill="url(#bgR)"/>
<clipPath id="cc"><rect width="900" height="270" rx="18"/></clipPath>
<g clip-path="url(#cc)"><rect width="900" height="270" fill="url(#grid)"/><rect class="scan" x="-80" y="0" width="80" height="270" fill="url(#scanG)"/></g>
<rect class="run" pathLength="1000" x="1" y="1" width="898" height="268" rx="18" fill="none" stroke="#39ff14" stroke-width="2" stroke-linecap="round" style="animation-delay:0s" filter="url(#glowG)"/><rect class="run" pathLength="1000" x="1" y="1" width="898" height="268" rx="18" fill="none" stroke="#ff2d55" stroke-width="2" stroke-linecap="round" style="animation-delay:-2.5s" filter="url(#glowR)"/>
<rect x="36" y="56" width="158" height="158" rx="30" fill="#06090d" stroke="#1b2330"/>
<rect class="run" pathLength="1000" x="36" y="56" width="158" height="158" rx="30" fill="none" stroke="#39ff14" stroke-width="2" stroke-linecap="round" style="animation-delay:0s" filter="url(#glowG)"/><rect class="run" pathLength="1000" x="36" y="56" width="158" height="158" rx="30" fill="none" stroke="#ff2d55" stroke-width="2" stroke-linecap="round" style="animation-delay:-2.5s" filter="url(#glowR)"/>
<text x="115" y="146" text-anchor="middle" font-size="62" font-weight="700" fill="#39ff14" filter="url(#glowG)">{Y}</text>
<text x="115" y="190" text-anchor="middle" font-size="13" letter-spacing="3" fill="#ff2d55" class="pulse">&lt;/&gt;</text>
<text x="230" y="68" font-size="12" letter-spacing="2" fill="#39ff14" class="fi">@YOUSSEF-AHMED-MOHMED</text>
<text x="230" y="104" font-size="18" fill="#ff2d55" filter="url(#glowR)" class="fu" style="animation-delay:.2s">Hi, I'm</text>
<clipPath id="type"><rect x="230" y="108" width="340" height="60"><animate attributeName="width" from="0" to="340" dur="1.5s" begin="0s" fill="freeze"/></rect></clipPath>
<g clip-path="url(#type)"><text x="230" y="148" font-size="44" font-weight="700" fill="#eaf6ee" textLength="330" lengthAdjust="spacingAndGlyphs">Youssef Ahmed</text></g>
<rect class="blink" x="570" y="114" width="4" height="42" fill="#ff2d55" filter="url(#glowR)"><animate attributeName="x" from="230" to="570" dur="1.5s" begin="0s" fill="freeze"/></rect>
<text x="230" y="186" font-size="17" font-weight="700" fill="#39ff14" filter="url(#glowG)"><tspan fill="#ff2d55">▸ </tspan><tspan class="rA">Full-Stack Developer · React / Next.js / Node</tspan></text>
<text x="250" y="186" font-size="17" font-weight="700" fill="#39ff14" class="rB" filter="url(#glowG)">AI &amp; Data Mining · Python / Scikit-learn</text>
<text x="250" y="186" font-size="17" font-weight="700" fill="#39ff14" class="rC" filter="url(#glowG)">Media &amp; Brand Lead · IEEE PUA</text>
<text x="230" y="212" font-size="13" fill="#7f8a99" class="fu" style="animation-delay:1.2s">CS &amp; AI student · Pharos University · Class of 2028</text>
<text x="230" y="232" font-size="13" fill="#7f8a99" class="fu" style="animation-delay:1.5s">Shipped EventHub: OAuth, RBAC &amp; signed-token QR ticketing.</text>
<circle cx="236" cy="251" r="4" fill="#39ff14" class="pulse" filter="url(#glowG)"/>
<text x="250" y="255" font-size="12" fill="#eaf6ee" class="fi" style="animation-delay:1.8s">Alexandria, Egypt  ·  Open to Software Engineering / AI Development roles</text>
</svg>