<svg xmlns="http://www.w3.org/2000/svg" width="900" height="456" viewBox="0 0 900 456" font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace">
<style>
.fu{animation:fu .8s ease-out both}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi 1s ease-out both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.run{stroke-dasharray:130 870;animation:run 5s linear infinite}
@keyframes run{to{stroke-dashoffset:-1000}}
.scan{animation:scan 6s linear infinite}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(1000px)}}
.scan2{animation:scan2 5s ease-in-out infinite alternate}
@keyframes scan2{from{transform:translateX(0)}to{transform:translateX(800px)}}
.grow{animation:grow 1.4s ease-out both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.draw{transform-box:fill-box;transform-origin:top;animation:draw 1.6s ease-out both}
@keyframes draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.rA{animation:roleA 9s linear infinite}
@keyframes roleA{0%,28%{opacity:1}33%,95%{opacity:0}100%{opacity:1}}
.rB{opacity:0;animation:role 9s linear 3s infinite}
.rC{opacity:0;animation:role 9s linear 6s infinite}
@keyframes role{0%{opacity:0}5%,28%{opacity:1}33%,100%{opacity:0}}
</style>
<defs>
<filter id="glowG" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowR" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#39ff14"/><stop offset="1" stop-color="#ff2d55"/></linearGradient>
<radialGradient id="bgG" cx="1" cy="1" r="0.8"><stop offset="0" stop-color="#39ff14" stop-opacity=".13"/><stop offset="1" stop-color="#39ff14" stop-opacity="0"/></radialGradient>
<radialGradient id="bgR" cx="0" cy="0" r="0.7"><stop offset="0" stop-color="#ff2d55" stop-opacity=".12"/><stop offset="1" stop-color="#ff2d55" stop-opacity="0"/></radialGradient>
<linearGradient id="scanG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39ff14" stop-opacity="0"/><stop offset="1" stop-color="#39ff14" stop-opacity=".22"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
</defs>
<text x="8" y="24" font-size="11" letter-spacing="2" fill="#39ff14">03</text><text x="38" y="24" font-size="11" letter-spacing="2" fill="#7f8a99">PROJECTS</text><g class="fu" style="animation-delay:0.20s"><rect x="0" y="44" width="440" height="196" rx="18" fill="#0b0f15" stroke="#1b2330"/><rect x="0" y="44" width="440" height="196" rx="18" fill="url(#bgG)"/><rect x="0" y="44" width="440" height="196" rx="18" fill="url(#bgR)"/><rect class="run" pathLength="1000" x="1" y="45" width="438" height="194" rx="18" fill="none" stroke="#39ff14" stroke-width="2" stroke-linecap="round" style="animation-delay:0s" filter="url(#glowG)"/>
<text x="24" y="84" font-size="17" font-weight="700" fill="#eaf6ee">EventHub</text><circle cx="370" cy="79" r="4" fill="#39ff14" class="pulse" filter="url(#glowG)"/><text x="382" y="83" font-size="11" letter-spacing="2" fill="#39ff14">LIVE</text><text x="24" y="106" font-size="11" fill="#39ff14">Next.js · React · TypeScript · Supabase · PostgreSQL</text><text x="24" y="138" font-size="12" fill="#7f8a99">Deployed event platform: discovery, real-time</text><text x="24" y="156" font-size="12" fill="#7f8a99">seats, reservations &amp; QR ticketing. OAuth</text><text x="24" y="174" font-size="12" fill="#7f8a99">(Google/GitHub), RBAC, signed-token tickets,</text><text x="24" y="192" font-size="12" fill="#7f8a99">organizer check-in, moderation.</text><text x="24" y="222" font-size="12" fill="#eaf6ee">↗ eventhub-i5pg.vercel.app</text></g><g class="fu" style="animation-delay:0.45s"><rect x="460" y="44" width="440" height="196" rx="18" fill="#0b0f15" stroke="#1b2330"/><rect x="460" y="44" width="440" height="196" rx="18" fill="url(#bgG)"/><rect x="460" y="44" width="440" height="196" rx="18" fill="url(#bgR)"/><rect class="run" pathLength="1000" x="461" y="45" width="438" height="194" rx="18" fill="none" stroke="#ff2d55" stroke-width="2" stroke-linecap="round" style="animation-delay:-1.2s" filter="url(#glowR)"/>
<text x="484" y="84" font-size="17" font-weight="700" fill="#eaf6ee">Full-Stack To-Do App</text><text x="484" y="106" font-size="11" fill="#ff2d55">React · Node.js · Express · MySQL · Prisma</text><text x="484" y="138" font-size="12" fill="#7f8a99">REST API (Express, Prisma, MySQL) connected to a</text><text x="484" y="156" font-size="12" fill="#7f8a99">React frontend for task management.</text><text x="484" y="222" font-size="12" fill="#eaf6ee">↗ github.com/Youssef-Ahmed-Mohmed</text></g><g class="fu" style="animation-delay:0.70s"><rect x="0" y="260" width="440" height="196" rx="18" fill="#0b0f15" stroke="#1b2330"/><rect x="0" y="260" width="440" height="196" rx="18" fill="url(#bgG)"/><rect x="0" y="260" width="440" height="196" rx="18" fill="url(#bgR)"/><rect class="run" pathLength="1000" x="1" y="261" width="438" height="194" rx="18" fill="none" stroke="#39ff14" stroke-width="2" stroke-linecap="round" style="animation-delay:-2.4s" filter="url(#glowG)"/>
<text x="24" y="300" font-size="17" font-weight="700" fill="#eaf6ee">NBA Shooting Analysis</text><text x="24" y="322" font-size="11" fill="#39ff14">Python · Pandas · Scikit-learn</text><text x="24" y="354" font-size="12" fill="#7f8a99">EDA and data mining on NBA shot logs by court</text><text x="24" y="372" font-size="12" fill="#7f8a99">zone, distance and defender proximity to find</text><text x="24" y="390" font-size="12" fill="#7f8a99">shot-success factors.</text></g><g class="fu" style="animation-delay:0.95s"><rect x="460" y="260" width="440" height="196" rx="18" fill="#0b0f15" stroke="#1b2330"/><rect x="460" y="260" width="440" height="196" rx="18" fill="url(#bgG)"/><rect x="460" y="260" width="440" height="196" rx="18" fill="url(#bgR)"/><rect class="run" pathLength="1000" x="461" y="261" width="438" height="194" rx="18" fill="none" stroke="#ff2d55" stroke-width="2" stroke-linecap="round" style="animation-delay:-3.5999999999999996s" filter="url(#glowR)"/>
<text x="484" y="300" font-size="17" font-weight="700" fill="#eaf6ee">Egyptian Car Plate System</text><text x="484" y="322" font-size="11" fill="#ff2d55">Python · OOP · SQLite</text><text x="484" y="354" font-size="12" fill="#7f8a99">CLI registration system that generates</text><text x="484" y="372" font-size="12" fill="#7f8a99">Egyptian-style plates and manages vehicle/owner</text><text x="484" y="390" font-size="12" fill="#7f8a99">records.</text></g>
</svg>